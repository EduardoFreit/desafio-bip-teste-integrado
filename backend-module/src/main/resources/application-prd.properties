# Server Configuration
server.port=8080
server.servlet.context-path=/backend-module

# Spring Application Configuration
spring.application.name=backend-module

# Database Configuration
spring.datasource.url=jdbc:h2:mem:backend-module
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=db-bip-teste-integrado
spring.datasource.password=DbH2Teste@2026

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.encoding=UTF-8

# H2 Console (para debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
